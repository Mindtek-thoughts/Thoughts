<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>A thought for today</title>
<style>
:root{--bg:#F4F0E8;--ink:#000000;--card:#ffffff;--chip:#e4dfd3;--btn:#000000;--btnink:#DFFF38;--accent:#DFFF38;--accentink:#000000;--shadow:0 8px 30px rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px}
main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px;flex:1}
.card{position:relative;border-radius:22px;min-height:52vh;padding:36px 28px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);background:var(--card) center/cover no-repeat;overflow:hidden;transition:opacity .25s}
.card.fade{opacity:0}
.card.hasimg::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38)}
.card.hasimg .txt{color:#fff}
.txt{position:relative;font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.4;margin:0}
.tag{position:absolute;top:14px;left:0;right:0;font:600 .7rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.card.hasimg .tag{color:#fff}
button{font:inherit;cursor:pointer;border:0}
.another{font:600 1rem system-ui,sans-serif;padding:14px;border-radius:14px;background:var(--btn);color:var(--btnink)}
.more{font:.8rem system-ui,sans-serif;opacity:.65;text-align:center;margin:6px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:.85rem system-ui,sans-serif;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accentink)}
.logo{display:block;margin:0 auto;max-width:200px;width:60%;height:auto;background:#fff;border-radius:14px;padding:6px}
.site{display:block;text-align:center;font:.85rem system-ui,sans-serif;color:var(--ink);opacity:.7;margin-top:10px;text-decoration:none}
.by{display:block;margin-top:14px;font:.9rem system-ui,sans-serif;opacity:.7}
</style>
</head>
<body>
<main>
  <img src="images/logo.png" alt="Mindtek Counselling" class="logo">
  <div class="card" id="card"><span class="tag" id="tag"></span><p class="txt" id="txt"></p></div>
  <button class="another" id="again">Show me another</button>
  <p class="more">Want something for a particular feeling?</p>
  <div class="chips" id="chips"></div>
  <a class="site" href="https://mindtek.co.nz" target="_blank" rel="noopener">visit mindtek.co.nz</a>
</main>
<script>
/* ===== EDIT YOUR CONTENT HERE =====
   t = the saying, c = category (must match a name in CATEGORIES),
   img = optional image path/URL (if set, the image is the card background).
   Swap these samples for your own. */
const SAYINGS = [
  {t:"The problem is the problem, You are not the problem.", c:"", img:"images/Punga 1.jpeg"},
  {t:"Thoughts are not facts.", c:"", img:"images/thoughts.jpg"},
  {t:"Feelings are not facts.", c:"", img:"images/feelings.jpg"},
  {t:"How is this thinking helping you?", c:""},
  {t:"Fit the Facts.", c:"", img:"images/fit.png"},
  {t:"You don’t have to control your thoughts. You just have to stop letting them lead.", c:"Anxiety", img:"images/Punga 1.jpeg"},
  {t:"Breathe out slowly. Longer than you breathed in. You’re safe in this moment.", c:"Anxiety"},
  {t:"A worried mind tells stories about the future. You can set the story down.", c:"Anxiety"},
  {t:"Feeling nervous doesn’t mean something is wrong. It can mean something matters.", c:"Anxiety"},
  {t:"Low days are weather, not climate. They pass, even when they’re slow.", c:"Depression", img:"images/clouds.jpeg"},
  {t:"Doing one small thing today is enough. Getting up counts.", c:"Depression"},
  {t:"You can feel heavy and still be moving forward.", c:"Depression", img:"images/Forest 1.jpg"},
  {t:"The voice that says you’re a burden is the problem talking, not the truth.", c:"Depression"},
  {t:"Not everything has to be solved today. Pick one thing, and let the rest wait.", c:"Stress"},
  {t:"You can’t pour from an empty cup. Rest is part of the work.", c:"Stress", img:"images/cup.jpeg"},
  {t:"Slow is still a pace. You’re allowed to take it one step at a time.", c:"Stress"},
  {t:"Put the list down for five minutes. It will still be there, and so will you.", c:"Stress"},
  {t:"Grief is love with nowhere to go. Let it move through you in its own time.", c:"Grief"},
  {t:"There’s no right way to grieve and no deadline for it.", c:"Grief"},
  {t:"Missing someone is one of the ways love keeps showing up.", c:"Grief"},
  {t:"You’re allowed to laugh and still be sad. Both can be true.", c:"Grief"},
  {t:"You are more than the worst thing you’ve thought about yourself.", c:"Self-worth"},
  {t:"Talk to yourself the way you’d talk to someone you love.", c:"Self-worth"},
  {t:"Your worth isn’t something you earn. It was there before you started.", c:"Self-worth"},
  {t:"Mistakes are part of learning. They don’t define who you are.", c:"Self-worth"},
  {t:"Right here, right now, I am safe.", c:"Mindfulness"},
  {t:"This too shall pass.", c:"Mindfulness"},
  {t:"Notice, don't judge.", c:"Mindfulness"},
  {t:"One thing at a time.", c:"Mindfulness"},
  {t:"One breath at a time.", c:"Mindfulness"},
  {t:"It’s better to light a candle than curse the dark", c:"", img:"images/candle.jpeg"}
];
const CATEGORIES = ["Anxiety","Depression","Stress","Grief","Self-worth","Mindfulness"];
/* ================================== */

const card=document.getElementById('card'), txt=document.getElementById('txt'),
      tag=document.getElementById('tag'), chips=document.getElementById('chips');
let current = "All";   // "All" = random from everything (the default on scan)
let lastIdx = -1;

// Optional: a category can be forced from the link, e.g. yoursite.com/#anxiety
const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
const fromHash = CATEGORIES.find(c => c.toLowerCase() === h);
if (fromHash) current = fromHash;

// Avoid repeating the last saying across scans (per phone)
try { const v = localStorage.getItem('lastIdx'); if (v !== null) lastIdx = +v; } catch(e){}

function pool(){ return SAYINGS.map((s,i)=>({s,i})).filter(o => current==="All" || o.s.c===current); }

function show(animate){
  const p = pool();
  let choice = p[Math.floor(Math.random()*p.length)];
  if (p.length > 1) while (choice.i === lastIdx) choice = p[Math.floor(Math.random()*p.length)];
  lastIdx = choice.i;
  try { localStorage.setItem('lastIdx', String(lastIdx)); } catch(e){}
  const apply = () => {
    txt.textContent = choice.s.t;
    if (choice.s.a){ const by=document.createElement('span'); by.className='by'; by.textContent='— '+choice.s.a; txt.appendChild(by); }
    tag.textContent = choice.s.c;
    if (choice.s.img){ card.style.backgroundImage = 'url("'+choice.s.img+'")'; card.classList.add('hasimg'); }
    else { card.style.backgroundImage = ''; card.classList.remove('hasimg'); }
    card.classList.remove('fade');
  };
  if (animate){ card.classList.add('fade'); setTimeout(apply, 220); } else apply();
}

function renderChips(){
  chips.innerHTML = '';
  ["All"].concat(CATEGORIES).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c;
    b.setAttribute('aria-pressed', String(c === current));
    b.onclick = () => { current = c; renderChips(); show(true); };
    chips.appendChild(b);
  });
}

document.getElementById('again').onclick = () => show(true);
renderChips();
show(false);   // a saying appears immediately, no menu first
</script>
</body>
</html>
