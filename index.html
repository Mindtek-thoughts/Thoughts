<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Calibrator</title>
<style>
:root{--bg:#F4F0E8;--ink:#000000;--card:#ffffff;--chip:#e4dfd3;--btn:#000000;--btnink:#DFFF38;--accent:#DFFF38;--accentink:#000000;--shadow:0 8px 30px rgba(0,0,0,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;padding:20px 16px 32px}
main{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px;flex:1}
.card{position:relative;border-radius:22px;min-height:52vh;padding:36px 28px;display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:var(--shadow);background:var(--card) center/cover no-repeat;overflow:hidden;transition:opacity .25s}
.card.fade{opacity:0}
.card.hasimg::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.38)}
.card.hasimg .txt{color:#fff}
.txt{position:relative;font-size:clamp(1.4rem,6vw,1.9rem);line-height:1.4;margin:0}
.tag{position:absolute;top:14px;left:0;right:0;font:600 .7rem system-ui,sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.55}
.card.hasimg .tag{color:#fff}
button{font:inherit;cursor:pointer;border:0}
.more{font:.8rem system-ui,sans-serif;opacity:.65;text-align:center;margin:6px 0 -6px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{font:.85rem system-ui,sans-serif;padding:8px 14px;border-radius:999px;background:var(--chip);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accentink)}
.logo{display:block;margin:0 auto;max-width:200px;width:60%;height:auto}
.site{display:block;text-align:center;font:.85rem system-ui,sans-serif;color:var(--ink);opacity:.7;margin-top:10px;text-decoration:none}
.by{display:block;margin-top:14px;font:.9rem system-ui,sans-serif;opacity:.7}
.logolink{display:block}
</style>
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<link rel="icon" type="image/png" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#F4F0E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Calibrator">  
</head>
<body>
<main>
  <a class="logolink" href="https://mindtek.co.nz" target="_blank" rel="noopener"><img src="images/calibrator-logo.png" alt="Mindtek Counselling" class="logo"></a>
  <div class="card" id="card"><span class="tag" id="tag"></span><p class="txt" id="txt"></p></div>
  <p class="more">Want something for a particular feeling?</p>
  <div class="chips" id="chips"></div>
  <a class="site" href="https://mindtek.co.nz" target="_blank" rel="noopener">visit mindtek.co.nz</a>
</main>
<script>
/* ===== EDIT YOUR CONTENT HERE =====
   t = the saying, c = category (must match a name in CATEGORIES),
   img = optional image path/URL (if set, the image is the card background).
   Swap these samples for your own. */
const SAYINGS = [
  //ALL
  {t:"The problem is the problem, You are not the problem.", c:"", img:"images/Punga 1.jpeg", a:"Micheal White"},
  {t:"Thoughts are not facts.", c:"", img:"images/pic42.jpg"},
  {t:"Feelings are not facts.", c:"", img:"images/pic39.jpg"},
  {t:"How is this thinking helping you?", c:"", img:"images/pic1.jpg"},
  {t:"Fit the Facts.", c:"", img:"images/fit.png"},
  {t:"Fact versus Opinion.", c:"", img:"images/pic30.jpg"},
  {t:"Real versus Ideal.", c:"", img:"images/pic31.jpg"},
  {t:"True versus Helpful.", c:"", img:"images/pic32.jpg"},
  {t:"Choose to focus your mind on what is good, honest, and uplifting instead of focusing on negativity, lies, or worry.", c:"", img:"images/pic33.jpg"},
  {t:"Maybe the grass is greener where you water it.", c:"", img:"images/pic34.jpg"},
  {t:"It’s better to light a candle than curse the dark.", c:"", img:"images/candle.jpeg"},
  {t:"Treat a man as he is, and he will remain as he is. Treat a man as he can and should be, and he will become as he can and should be.", c:"", img:"images/", a:"Goethe"},
  
  //ANXIETY
  {t:"You don’t have to control your thoughts. You just have to stop letting them lead.", c:"Anxiety", img:"images/pic36.jpg"},
  {t:"Breathe out slowly. Longer than you breathed in. You’re safe in this moment.", c:"Anxiety", img:"images/pic2.jpg"},
  {t:"A worried mind tells stories about the future. You can set the story down.", c:"Anxiety", img:"images/pic3.jpg"},
  {t:"Feeling nervous doesn’t mean something is wrong. It can mean something matters.", c:"Anxiety", img:"images/pic4.jpg"},
  {t:"I can’t change reality, but I can change how I feel about it.", c:"Anxiety", img:"images/pic23.jpg"},
  {t:"Something false can feel very true. I mustn’t let a feeling convince me it’s fact", c:"Anxiety", img:"images/pic24.jpg"},
  {t:"The way I think creates how I feel.", c:"Anxiety", img:"images/pic25.jpg"},
  {t:"I make me feel. Other people are not responsible for how I feel.", c:"Anxiety", img:"images/pic26.jpg"},
  {t:"Reality is not responsible for how I feel.", c:"Anxiety"},
  {t:"Perceived threats are not life-threatening.", c:"Anxiety", img:"images/pic27.jpg"},
  {t:"Where is this thinking taking me?", c:"Anxiety", img:"images/pic28.jpg"},
  {t:"Discomfort may be uncomfortable, but it won’t kill me, just breath and ride it out.", c:"Anxiety", img:"images/pic29.jpg"},
  {t:"What could your ladder thought be?.", c:"Anxiety", img:"images/pic41.jpg"},
  {t:"Worry is a visitor, not the owner of the house.", c:"Anxiety"},
  {t:"Anxiety tells you what could go wrong. You get to decide what to do with that.", c:"Anxiety"},
  {t:"Name five things you can see right now. You’re here.", c:"Anxiety|Mindfulness"},
  {t:"You can feel the fear and still take the next small step.", c:"Anxiety"},
  {t:"This feeling is uncomfortable, not dangerous. It will pass.", c:"Anxiety"},
  {t:"A thought is just a thought. You don’t have to obey it.", c:"Anxiety"},
  
  //DEPRESSION
  {t:"Low days are weather, not the climate.", c:"Depression", img:"images/clouds.jpeg"},
  {t:"Low days pass, even when they’re slow.", c:"Depression"},
  {t:"Doing one small thing today is enough.", c:"Depression", img:"images/pic5.jpg"},
  {t:"Getting up counts.", c:"Depression"},
  {t:"You can feel heavy and still be moving forward.", c:"Depression", img:"images/Forest 1.jpg"},
  {t:"The voice that says you’re a burden is the problem talking, not the truth.", c:"Depression", img:"images/pic6.jpg"},
  {t:"Depression is a heavy coat. It isn’t who you are.", c:"Depression"},
  {t:"You don’t have to feel better to do one small, good thing.", c:"Depression"},
  {t:"Tired is not the same as failing.", c:"Depression"},
  {t:"The heaviness lies about how long it will last.", c:"Depression"},
  {t:"Reaching out on a hard day takes real courage.", c:"Depression"},
  {t:"What matters most to you? Take one small step towards it.", c:"Depression"},
  {t:"Your record of getting through hard days is 100%.", c:"Depression"},
  
  //STRESS
  {t:"Not everything has to be solved today.", c:"Stress", img:"images/pic7.jpg"},
  {t:"Pick one thing, and let the rest wait.", c:"Stress"},
  {t:"You can’t pour from an empty cup.", c:"Stress", img:"images/cup.jpeg"},
  {t:"Rest is part of the work.", c:"Stress"},
  {t:"Slow is still a pace.", c:"Stress", img:"images/pic8.jpg"},

  {t:"It will still be there, and so will you.", c:"Stress"},
  {t:"Selfcare is not Selfish.", c:"Stress", img:"images/pic40.jpg"},
  {t:"You can do the next thing without finishing everything.", c:"Stress"},

  {t:"Grief is love with nowhere to go.", c:"Grief", img:"images/pic10.jpg"},
  {t:"Let loss move through you in its own time.", c:"Grief"},
  {t:"There’s no right way to grieve and no deadline for it.", c:"Grief", img:"images/pic11.jpg"},
  {t:"Missing someone is one of the ways love keeps showing up.", c:"Grief", img:"images/pic12.jpg"},
  {t:"You’re allowed to laugh and still be sad. Both can be true.", c:"Grief", img:"images/pic13.jpg"},
  {t:"Grief changes shape, but love stays.", c:"Grief"},
  {t:"Some days will be harder than others. That doesn’t mean you’re going backwards.", c:"Grief"},
  {t:"You can carry someone with you and still keep going.", c:"Grief"},
  {t:"Tears are one way love speaks.", c:"Grief"},
  {t:"Be gentle with yourself.", c:"Grief"},
  {t:"it's ok, You’re doing something hard.", c:"Grief"},
  
  //SELFWORTH
  {t:"You are not the worst thing you’ve thought about yourself.", c:"Self-worth", img:"images/pic14.jpg"},
  {t:"Talk to yourself the way you’d talk to someone you love.", c:"Self-worth", img:"images/pic15.jpg"},
  {t:"Your worth isn’t something you earn.", c:"Self-worth", img:"images/pic16.jpg"},
  {t:"Mistakes are part of learning. They don’t define who you are.", c:"Self-worth", img:"images/pic17.jpg"},
  {t:"Mistakes don’t define who you are.", c:"Self-worth", img:"images/pic17.jpg"},
  {t:"You are not your worst day.", c:"Self-worth"},
  {t:"The critic in your head is loud, but it isn’t always right.", c:"Self-worth"},
  {t:"You’re allowed to take up space.", c:"Self-worth"},
  {t:"Being imperfect doesn’t make you less worthy.", c:"Self-worth"},

  {t:"Be as kind to yourself as you would be to a good friend.", c:"Self-worth"},
  {t:"What would you say to someone you care about who felt this way?", c:"Self-worth"},
  {t:"It’s okay to ask for help. That’s part of being strong.", c:"Self-worth"},
  {t:"Asking for help is being strong.", c:"Self-worth"},
  
  //MINDFULNESS
  {t:"Right here, right now, I am safe.", c:"Mindfulness", img:"images/pic18.jpg"},
  {t:"This too shall pass.", c:"Mindfulness", img:"images/pic19.jpg"},
  {t:"Notice, don't judge.", c:"Mindfulness", img:"images/pic20.jpg"},
  {t:"One thing at a time.", c:"Mindfulness", img:"images/pic21.jpg"},
  {t:"One breath at a time.", c:"Mindfulness", img:"images/pic22.jpg"},
  {t:"You don't have to be swept away by your feelings. You can respond with wisdom and kindness rather than habit and reactivity.", c:"Mindfulness", a:"Bhante Henepola Gunaratana", img:"images/pic35.jpg"},
  {t:"Pause. You get to choose what you do next.", c:"Mindfulness|Anxiety"},
  {t:"You can notice a thought without following it.", c:"Mindfulness"},
  
];
const CATEGORIES = ["Anxiety","Depression","Stress","Grief","Self-worth","Mindfulness"];
/* ================================== */

const card=document.getElementById('card'), txt=document.getElementById('txt'),
      tag=document.getElementById('tag'), chips=document.getElementById('chips');
let current = "All";   // "All" = random from everything (the default on scan)
let lastIdx = -1;

// Optional: a category can be forced from the link, e.g. yoursite.com/#anxiety
const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
const fromHash = CATEGORIES.find(c => c.toLowerCase() === h);
if (fromHash) current = fromHash;

// Avoid repeating the last saying across scans (per phone)
try { const v = localStorage.getItem('lastIdx'); if (v !== null) lastIdx = +v; } catch(e){}

function pool(){ return SAYINGS.map((s,i)=>({s,i})).filter(o => current==="All" || (o.s.c||"").split("|").includes(current)); }

function show(animate){
  const p = pool();
  let choice = p[Math.floor(Math.random()*p.length)];
  if (p.length > 1) while (choice.i === lastIdx) choice = p[Math.floor(Math.random()*p.length)];
  lastIdx = choice.i;
  try { localStorage.setItem('lastIdx', String(lastIdx)); } catch(e){}
  const apply = () => {
    txt.textContent = choice.s.t;
    if (choice.s.a){ const by=document.createElement('span'); by.className='by'; by.textContent='— '+choice.s.a; txt.appendChild(by); }
    tag.textContent = (choice.s.c||"").split("|").join(" · ");
    if (choice.s.img){ card.style.backgroundImage = 'url("'+choice.s.img+'")'; card.classList.add('hasimg'); }
    else { card.style.backgroundImage = ''; card.classList.remove('hasimg'); }
    card.classList.remove('fade');
  };
  if (animate){ card.classList.add('fade'); setTimeout(apply, 220); } else apply();
}

function renderChips(){
  chips.innerHTML = '';
  ["All"].concat(CATEGORIES).forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = c;
    b.setAttribute('aria-pressed', String(c === current));
    b.onclick = () => { current = c; renderChips(); show(true); };
    chips.appendChild(b);
  });
}

renderChips();
show(false);   // a saying appears immediately, no menu first
</script>
<script data-goatcounter="https://mindtek.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>  
</body>
</html>
